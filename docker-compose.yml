# Run everything:  cp .env.example .env  (fill in secrets)  &&  docker compose up --build
# App: http://localhost:8081 (set FRONTEND_PORT to choose another host port)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      RERANKER_MODEL: ${RERANKER_MODEL:-none}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
    volumes: [ai_data:/app/data]
    # Not published to the host: only the backend can reach it.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, ai-service]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/legal_analyzer
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8081}
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-600000}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes: [uploads:/app/uploads]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-8081}:80"]

volumes:
  mongo_data:
  ai_data:
  uploads:
